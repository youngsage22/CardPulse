<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Card Checker</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; margin-bottom: 1.5rem; color: #3b82f6; }
        button {
            width: 100%;
            padding: 15px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #2563eb; }
        button:disabled { background-color: #64748b; cursor: not-allowed; }
        #status {
            margin-top: 1.5rem;
            padding: 1rem;
            text-align: center;
            border-radius: 6px;
            display: none;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .live { background-color: #10b981; color: white; border: 1px solid #059669; }
        .dead { background-color: #ef4444; color: white; border: 1px solid #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <h2>💳 Pro Checker</h2>
    
    <div id="card-element" style="padding: 12px; border: 1px solid #334155; background: #0f172a; color: #fff; border-radius: 6px; margin-bottom: 1rem;"></div>
    
    <button id="pingBtn" onclick="checkLive()">Ping Card</button>
    
    <div id="status"></div>
</div>

<script>
    // 🔑 YOUR PUBLISHABLE KEY
    const stripe = Stripe('pk_test_51U7cR15QRAPh6Gb2aaHJLny4UGoIQjUqmOSTxQAnisN4Ms3FRdkBtSVeKaIuFUN8C2ijNdrPa6YKgFuHfOFjp4xL000rKID5gY');
    const elements = stripe.elements();
    const cardElement = elements.create('card');
    cardElement.mount('#card-element');

    async function checkLive() {
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('pingBtn');

        // Reset UI
        statusDiv.style.display = 'none';
        statusDiv.className = '';
        btn.disabled = true;
        btn.innerText = "Validating...";

        try {
            // ✅ CORRECT METHOD: Create a Token
            // This validates the card number, expiry, and CVC.
            const { token, error } = await stripe.createToken(cardElement);

            if (error) {
                throw error;
            }

            // If we get here, the card is valid.
            statusDiv.style.display = 'block';
            statusDiv.className = 'live';
            statusDiv.innerText = `✅ Live (Token: ${token.id.slice(0, 10)}...)`;

        } catch (err) {
            statusDiv.style.display = 'block';
            statusDiv.className = 'dead';
            statusDiv.innerText = `❌ Declined/Invalid: ${err.message}`;
        }

        btn.disabled = false;
        btn.innerText = "Ping Card";
    }
</script>

</body>
</html>
