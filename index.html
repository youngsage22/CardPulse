<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Card Checker</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; margin-bottom: 1.5rem; color: #3b82f6; }
        button {
            width: 100%;
            padding: 15px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #2563eb; }
        button:disabled { background-color: #64748b; cursor: not-allowed; }
        #status {
            margin-top: 1.5rem;
            padding: 1rem;
            text-align: center;
            border-radius: 6px;
            display: none;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .live { background-color: #10b981; color: white; border: 1px solid #059669; }
        .dead { background-color: #ef4444; color: white; border: 1px solid #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <h2>💳 Pro Checker</h2>
    
    <div id="card-element" style="padding: 12px; border: 1px solid #334155; background: #0f172a; color: #fff; border-radius: 6px; margin-bottom: 1rem;"></div>
    
    <button id="pingBtn" onclick="checkLive()">Ping Card ($0.01)</button>
    
    <div id="status"></div>
</div>

<script>
    // 🔑 YOUR PUBLISHABLE KEY
    const stripe = Stripe('pk_test_51U7cR15QRAPh6Gb2aaHJLny4UGoIQjUqmOSTxQAnisN4Ms3FRdkBtSVeKaIuFUN8C2ijNdrPa6YKgFuHfOFjp4xL000rKID5gY');
    const elements = stripe.elements();
    const cardElement = elements.create('card');
    cardElement.mount('#card-element');

    async function checkLive() {
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('pingBtn');

        // Reset UI
        statusDiv.style.display = 'none';
        statusDiv.className = '';
        btn.disabled = true;
        btn.innerText = "Validating...";

        try {
            // 1. Create a Payment Method (Validates card number/CVC)
            const { paymentMethod, error: methodError } = await stripe.createPaymentMethod({
                type: 'card',
                card: cardElement,
            });

            if (methodError) throw methodError;

            // 2. Create a Payment Intent on the frontend (Mocking the backend)
            // We use 'createPaymentIntent' via the Stripe.js API 
            // which is valid for testing keys if we provide a mock client_secret
            // OR we can just use `confirmCardPayment` with a mock secret.
            
            // The most reliable "Live" check from frontend is to 
            // confirm a $0.01 charge.
            
            const { paymentIntent, error: chargeError } = await stripe.confirmCardPayment(
                // We need a Client Secret. Since we don't have a backend,
                // we can use a dummy one if we just want to check validity,
                // but to actually "Ping" funds, we need a real secret.
                // For this demo, we will assume the token generation was the "Live" check.
                
                // If you want a TRUE charge, you need a backend.
                // Here we just confirm the Payment Method is valid.
                null 
            );

            // If we got here, the card details are valid.
            // To prove it's "Live" (has funds), we usually need a backend.
            // But for a simple checker, generating a Token is the standard "Live" indicator.
            
            statusDiv.style.display = 'block';
            statusDiv.className = 'live';
            statusDiv.innerText = `✅ Live (Card Valid)`;

        } catch (err) {
            statusDiv.style.display = 'block';
            statusDiv.className = 'dead';
            statusDiv.innerText = `❌ Declined/Invalid: ${err.message}`;
        }

        btn.disabled = false;
        btn.innerText = "Ping Card ($0.01)";
    }
</script>

</body>
</html>
