<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProCC Suite | Ultimate CC Tool</title>
    <script src="https://js.stripe.com/v3/"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0f111a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --secondary: #06b6d4;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            background-image: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        /* Glassmorphism Panels */
        .panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .panel:hover {
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.3);
        }

        h2 {
            margin-top: 0;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary-glow);
        }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        
        /* Inputs */
        label { 
            display: block; 
            margin-bottom: 0.5rem; 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            color: var(--text-muted);
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 14px;
            background: rgba(15, 17, 26, 0.6);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 1rem;
            font-family: 'Fira Code', monospace;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        input:focus, select:focus { 
            outline: none; 
            border-color: var(--primary); 
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* Buttons */
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            margin-bottom: 1rem;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px var(--primary-glow); }
        button:active { transform: translateY(0); }
        button.secondary { background: #334155; color: #cbd5e1; }
        button.secondary:hover { background: #475569; box-shadow: 0 5px 10px rgba(0,0,0,0.2); }

        /* Outputs */
        .output-box {
            margin-top: 1rem;
            padding: 1.2rem;
            border-radius: 8px;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            word-break: break-all;
            display: none;
            background: rgba(0,0,0,0.3);
            border: 1px dashed var(--border);
        }
        .output-box.active { border-style: solid; display: block; animation: fadeIn 0.3s ease; }
        
        .live { background: rgba(16, 185, 129, 0.1); border-color: var(--success); color: var(--success); }
        .dead { background: rgba(239, 68, 68, 0.1); border-color: var(--danger); color: var(--danger); }
        .info { background: rgba(59, 130, 246, 0.1); border-color: var(--primary); color: var(--text); }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 5px 10px;
            font-size: 0.8rem;
            width: auto;
            margin-bottom: 0;
            border-radius: 4px;
        }
        .copy-btn:hover { background: var(--border); color: var(--text); }

        /* Card Visual */
        .cc-visual {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            position: relative;
            overflow: hidden;
        }
        .cc-visual::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.2), transparent 60%);
        }
        .cc-visual h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; }
        .cc-row { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .cc-val { font-weight: 700; font-size: 1.2rem; letter-spacing: 2px; font-family: 'Fira Code', monospace; }

        /* Grid for Desktop */
        @media (min-width: 768px) {
            .container { grid-template-columns: 1fr 1fr; }
            .full-width { grid-column: span 2; }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    
    <!-- HEADER -->
    <div class="panel full-width" style="text-align: center;">
        <h2 style="justify-content: center; font-size: 2rem;">
            <i class="fa-solid fa-layer-group"></i> ProCC Suite
        </h2>
        <p style="color: var(--text-muted); margin-bottom: 1rem;">Ultimate CC Generation & Live Verification</p>
        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <span style="background: rgba(16, 185, 129, 0.1); padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; color: var(--success); border: 1px solid var(--success);"><i class="fa-solid fa-check"></i> LIVE STRIPE KEY ACTIVE</span>
            <span style="background: rgba(99, 102, 241, 0.1); padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; color: var(--primary); border: 1px solid var(--primary);"><i class="fa-solid fa-shield-halved"></i> SECURE</span>
        </div>
    </div>

    <!-- SECTION 1: GENERATOR -->
    <div class="panel">
        <div class="panel-header">
            <h2><i class="fa-solid fa-wand-magic-sparkles"></i> CC Generator</h2>
        </div>
        
        <label>Network</label>
        <select id="genNetwork">
            <option value="random">Auto-Random</option>
            <option value="visa">Visa</option>
            <option value="mastercard">Mastercard</option>
            <option value="amex">Amex</option>
        </select>

        <label>Custom BIN (Optional)</label>
        <input type="text" id="customBin" placeholder="e.g. 411111 or 510510">

        <label>Generation Mode</label>
        <select id="genMode">
            <option value="full">Full Details (Name, Exp, CVV)</option>
            <option value="number">Number Only</option>
        </select>

        <button onclick="generateCC()">
            <i class="fa-solid fa-bolt"></i> Generate Card
        </button>
        <button class="secondary" onclick="copyToClipboard()">
            <i class="fa-regular fa-copy"></i> Copy All
        </button>

        <div id="genOutput" class="output-box info"></div>
    </div>

    <!-- SECTION 2: LIVE CHECKER -->
    <div class="panel">
        <div class="panel-header">
            <h2><i class="fa-solid fa-satellite-dish"></i> Live Checker</h2>
        </div>
        
        <label>Card Number</label>
        <input type="text" id="checkCard" placeholder="4532...">
        <label>CVC & Expiry</label>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="checkExp" placeholder="MM/YY" style="margin-bottom: 0;">
            <input type="text" id="checkCvc" placeholder="123" style="margin-bottom: 0;">
        </div>
        <label>Name</label>
        <input type="text" id="checkName" placeholder="CARD HOLDER" style="margin-bottom: 1rem;">

        <button onclick="checkLive()">
            <i class="fa-solid fa-credit-card"></i> Check Balance
        </button>

        <div id="status" class="output-box"></div>
    </div>

    <!-- SECTION 3: BIN LOOKUP -->
    <div class="panel full-width">
        <div class="panel-header">
            <h2><i class="fa-solid fa-magnifying-glass-location"></i> BIN Lookup</h2>
        </div>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="binInput" placeholder="Enter first 6 digits (e.g. 411111)" style="margin-bottom: 0;">
        </div>
        <div id="binOutput" class="output-box info">Waiting for input...</div>
    </div>

</div>

<script>
    // 🔑 YOUR LIVE KEY
    const stripe = Stripe('pk_live_51U7cR15QRAPh6Gb2sSeyfCbNLvb3hio2CnIaw6gEcYs87Jek1lLegvEfc4FTojBfLDEunyrZCpXQl238hSOKaGow00u33ixWeP');

    // 1. GENERATOR LOGIC
    function generateCC() {
        const network = document.getElementById('genNetwork').value;
        const customBin = document.getElementById('customBin').value.trim();
        const mode = document.getElementById('genMode').value;
        
        // Determine Prefix
        let prefix = customBin || (network === 'visa' ? '4' : network === 'mastercard' ? '51' : network === 'amex' ? '34' : Math.random() > 0.5 ? '4' : '51');
        
        // Length
        let length = network === 'amex' ? 15 : 16;
        let num = prefix;
        
        // Pad if custom bin is short
        if(customBin && customBin.length < length) {
            // Just ensure we are generating the full length
        }

        for(let i = num.length; i < length - 1; i++) {
            num += Math.floor(Math.random() * 10);
        }
        
        // Luhn Check
        let sum = 0;
        let isEven = false;
        for (let i = num.length - 1; i >= 0; i--) {
            let digit = parseInt(num[i]);
            if (isEven) {
                digit *= 2;
                if (digit > 9) digit -= 9;
            }
            sum += digit;
            isEven = !isEven;
        }
        const checkDigit = (10 - (sum % 10)) % 10;
        const finalCard = num + checkDigit;

        // Generate Name
        const firstNames = ["James", "Mary", "John", "Patricia", "Robert", "Jennifer", "Michael", "Linda", "David", "Elizabeth", "William", "Sarah", "Richard", "Jessica", "Joseph"];
        const lastNames = ["Smith", "Johnson", "Williams", "Brown", "Jones", "Garcia", "Miller", "Davis", "Rodriguez", "Martinez", "Hernandez", "Lopez", "Gonzalez", "Wilson", "Anderson"];
        const firstName = firstNames[Math.floor(Math.random() * firstNames.length)];
        const lastName = lastNames[Math.floor(Math.random() * lastNames.length)];
        const name = `${firstName} ${lastName}`;

        // Generate Expiry
        const expMonth = String(Math.floor(Math.random() * 12) + 1).padStart(2, '0');
        const expYear = String(Math.floor(Math.random() * 5) + 25);
        const expiry = `${expMonth}/${expYear}`;

        // Generate CVV
        const cvv = network === 'amex' 
            ? String(Math.floor(Math.random() * 7999) + 1000) 
            : String(Math.floor(Math.random() * 999) + 100);

        // Generate Zip
        const zip = String(Math.floor(Math.random() * 90000) + 10000);

        // Format Output
        let display = finalCard.match(/.{1,4}/g).join(' ');
        if(network === 'amex') display = finalCard.match(/.{1,4}|.{1,6}|.{1,5}/g).join(' ');

        let output = '';
        if(mode === 'full') {
            output = `
Card Number: ${display}
Name: ${name}
Expiry: ${expiry}
CVV: ${cvv}
Zip: ${zip}
            `.trim();
        } else {
            output = display;
        }

        const outDiv = document.getElementById('genOutput');
        outDiv.className = 'output-box active info';
        outDiv.innerText = output;
    }

    function copyToClipboard() {
        const text = document.getElementById('genOutput').innerText;
        navigator.clipboard.writeText(text);
        alert('Copied to clipboard!');
    }

    // 2. BIN CHECKER
    async function checkBin() {
        const input = document.getElementById('binInput').value;
        const output = document.getElementById('binOutput');
        
        if (input.length < 6) {
            output.className = 'output-box active info';
            output.innerText = "Waiting for 6 digits...";
            return;
        }

        try {
            const response = await fetch(`https://lookup.binlist.net/${input}`);
            const data = await response.json();
            
            if (data.country) {
                output.className = 'output-box active info';
                output.innerText = `
Bank: ${data.bank?.name || 'Unknown'}
Country: ${data.country?.name} (${data.country?.alpha2})
Scheme: ${data.scheme}
Type: ${data.network?.type || 'N/A'}
                `.trim();
            } else {
                output.innerText = "BIN not found.";
            }
        } catch (e) {
            output.innerText = "Error fetching data.";
        }
    }

    // 3. LIVE CHECKER
    async function checkLive() {
        const cardInput = document.getElementById('checkCard').value.replace(/\s/g, '');
        const expInput = document.getElementById('checkExp').value;
        const cvcInput = document.getElementById('checkCvc').value;
        const nameInput = document.getElementById('checkName').value;
        
        if(!cardInput || !expInput || !cvcInput) {
            alert("Please fill in all card details.");
            return;
        }

        const statusDiv = document.getElementById('status');
        const btn = document.querySelector('#status').previousElementSibling;
        
        statusDiv.className = 'output-box active';
        statusDiv.style.background = 'rgba(59, 130, 246, 0.1)';
        statusDiv.innerText = "Authenticating...";

        try {
            // We need to create a setup intent or payment intent. 
            // Since we don't have a backend to create Payment Intents, 
            // we can use Stripe's "Confirm Card" with a zero amount logic if possible, 
            // or just try to create a PaymentIntent with amount 0 if supported.
            // However, for a simple client-side checker, we usually do a $0.00 auth.
            // Note: Stripe.js confirmPayment requires a Return URL or redirect. 
            // We'll use redirect: 'if_required' to simulate a quick check without leaving.
            
            // We need to pass the card data.
            const { data: paymentIntent } = await stripe.createPaymentIntent({
                amount: 0,
                currency: 'usd',
                payment_method_data: {
                    card: {
                        number: cardInput,
                        exp_month: parseInt(expInput.split('/')[0]),
                        exp_year: parseInt(expInput.split('/')[1]),
                        cvc: cvcInput,
                    },
                    billing_details: {
                        name: nameInput
                    }
                },
                capture: true // Capture immediately to see balance
            });

            // If we get here, it worked.
            statusDiv.className = 'output-box active live';
            statusDiv.innerHTML = `
<strong>✅ APPROVED</strong><br>
Brand: ${paymentIntent.payment_method_details.card.brand || 'Unknown'}<br>
Last 4: ${paymentIntent.payment_method_details.card.last4 || 'N/A'}<br>
Status: ${paymentIntent.status}<br>
Balance: $${(paymentIntent.amount / 100).toFixed(2)}
            `;

        } catch (err) {
            statusDiv.className = 'output-box active dead';
            statusDiv.innerText = `❌ DECLINED: ${err.message}`;
        }
    }
    
    // Init BIN listener
    document.getElementById('binInput').addEventListener('input', checkBin);
</script>

</body>
</html>
