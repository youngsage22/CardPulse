<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stripe Live Checker</title>
    <!-- Stripe JS Library -->
    <script src="https://js.stripe.com/v3/"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .checker-container {
            background: #1a1a24;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 350px;
            border: 1px solid #333;
        }

        .panel-header {
            text-align: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #333;
            padding-bottom: 1rem;
        }

        .panel-header h2 {
            margin: 0;
            font-size: 1.2rem;
            color: #a8a8b3;
        }

        .panel-header i {
            color: #6e7681;
            margin-right: 8px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #888;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #0b0b10;
            border: 1px solid #333;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #5e72e4;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #5e72e4, #825ee4);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
        }

        .output-box {
            margin-top: 15px;
            padding: 15px;
            background: #0b0b10;
            border-radius: 6px;
            font-size: 0.9rem;
            min-height: 60px;
            word-break: break-all;
            border-left: 4px solid transparent;
        }

        .active {
            border-left-color: #5e72e4;
            animation: pulse 1s infinite;
        }

        .live {
            border-left-color: #2dce89;
            color: #2dce89;
            background: rgba(45, 206, 137, 0.1);
        }

        .dead {
            border-left-color: #f5365c;
            color: #f5365c;
            background: rgba(245, 54, 92, 0.1);
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        .status-msg {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="checker-container">
    <div class="panel-header">
        <h2><i class="fa-solid fa-satellite-dish"></i> Live Checker</h2>
    </div>

    <label>Card Number</label>
    <input type="text" id="cardNumber" placeholder="4242 4242 4242 4242" maxlength="19">
    
    <label>Expiration</label>
    <input type="text" id="cardExp" placeholder="MM/YY" maxlength="5">

    <label>CVC</label>
    <input type="text" id="cardCvc" placeholder="123" maxlength="4">

    <label>Name on Card</label>
    <input type="text" id="cardName" placeholder="JOHN DOE">

    <button id="btnCheck" onclick="checkCard()">
        <i class="fa-solid fa-check-circle"></i> CHECK LIVE
    </button>

    <div id="status" class="output-box">Ready to check...</div>
</div>

<script>
    // 🔑 REPLACE WITH YOUR LIVE KEY
    const stripe = Stripe('pk_live_51U7cR15QRAPh6Gb2sSeyfCbNLvb3hio2CnIaw6gEcYs87Jek1lLegvEfc4FTojBfLDEunyrZCpXQl238hSOKaGow00u33ixWeP');

    const statusDiv = document.getElementById('status');
    const btn = document.getElementById('btnCheck');

    // Input formatting helpers
    document.getElementById('cardNumber').addEventListener('input', function (e) {
        e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
    });

    document.getElementById('cardExp').addEventListener('input', function (e) {
        let input = e.target.value.replace(/[^\d/]/g, '');
        if (input.length === 2 && !input.includes('/') && input.length > 2) {
            input = input.slice(0, 2) + '/' + input.slice(2);
        }
        e.target.value = input;
    });

    async function checkCard() {
        const cardNum = document.getElementById('cardNumber').value.replace(/\s/g, '');
        const exp = document.getElementById('cardExp').value;
        const cvc = document.getElementById('cardCvc').value;
        const name = document.getElementById('cardName').value;

        if (!cardNum || !exp || !cvc) {
            updateStatus('dead', '❌ ERROR: Please fill in all fields.');
            return;
        }

        // Start loading state
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
        statusDiv.className = 'output-box active';
        statusDiv.innerText = 'Connecting to Stripe Gateway...';

        try {
            // 1. Create Payment Method (The correct client-side function)
            const result = await stripe.createPaymentMethod({
                type: 'card',
                card: {
                    number: cardNum,
                    exp_month: parseInt(exp.split('/')[0]),
                    exp_year: parseInt(exp.split('/')[1]),
                    cvc: cvc,
                },
                billing_details: {
                    name: name
                }
            });

            // 2. Handle Errors
            if (result.error) {
                updateStatus('dead', `❌ DECLINED: ${result.error.message}`);
            } 
            // 3. Success
            else {
                const pm = result.paymentMethod;
                const cardInfo = pm.card;
                
                // Determine status based on CVC and Bin check
                let isLive = false;
                let reason = '';

                // Heuristic for "Live": CVC passed OR it's a valid format that Stripe accepted
                if (cardInfo.checks.cvc_check === 'pass') {
                    isLive = true;
                    reason = 'CVC Matched';
                } else if (cardInfo.country) {
                    // If Stripe accepted it but CVC didn't match, it might still be a valid card number
                    isLive = true; 
                    reason = 'Card Valid (CVC Mismatch)';
                } else {
                    isLive = false;
                    reason = 'Invalid Card Details';
                }

                if (isLive) {
                    updateStatus('live', `
                        <span class="status-msg">✅ LIVE / VALID</span>
                        Brand: ${cardInfo.brand.toUpperCase()}<br>
                        Last 4: ${cardInfo.last4}<br>
                        Country: ${cardInfo.country || 'N/A'}<br>
                        CVC: ${cardInfo.checks.cvc_check}<br>
                        <small>ID: ${pm.id}</small>
                    `);
                } else {
                    updateStatus('dead', `
                        <span class="status-msg">❌ DEAD / INVALID</span>
                        ${reason}<br>
                        <small>ID: ${pm.id}</small>
                    `);
                }
            }

        } catch (err) {
            updateStatus('dead', `❌ SYSTEM ERROR: ${err.message}`);
        } finally {
            // Reset button
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-check-circle"></i> CHECK LIVE';
        }
    }

    function updateStatus(type, htmlContent) {
        statusDiv.className = `output-box active ${type}`;
        statusDiv.innerHTML = htmlContent;
    }
</script>

</body>
</html>
