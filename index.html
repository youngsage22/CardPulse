<!DOCTYPE html>
<html>
<head>
    <title>Stripe Elements Fix</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        #card-element { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div id="card-element">
    <!-- Stripe Elements will inject the secure input fields here -->
</div>
<button id="btn">Pay</button>

<script>
    // 🔑 REPLACE WITH YOUR PUBLISHABLE KEY
    const stripe = Stripe('pk_test_TYooMQauvdEDq54NiTphI7jx');
    const elements = stripe.elements();

    // 1. Create the Card Element
    const cardElement = elements.create('card', {
        style: {
            base: {
                fontSize: '16px',
                color: '#424770',
                '::placeholder': { color: '#aab7c4' },
            },
            invalid: { color: '#9e2146' },
        }
    });

    // 2. Mount the Element to the DOM
    cardElement.mount('#card-element');

    document.getElementById('btn').addEventListener('click', async () => {
        const btn = document.getElementById('btn');
        btn.disabled = true;
        btn.textContent = 'Processing...';

        // 3. Correct Way: Create a Token/PaymentMethod using the Element instance
        try {
            const result = await stripe.createToken(cardElement);
            
            if (result.error) {
                // Show error in your UI
                console.error(result.error.message);
                btn.disabled = false;
                btn.textContent = 'Pay';
            } else {
                // Token created successfully
                console.log('Token:', result.token);
                // Send result.token.id to your backend
                alert('Success! Token ID: ' + result.token.id);
            }
        } catch (err) {
            console.error(err);
        } finally {
            btn.disabled = false;
            btn.textContent = 'Pay';
        }
    });
</script>

</body>
</html>
