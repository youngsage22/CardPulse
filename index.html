<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro CC Suite</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text: #f8fafc;
            --border: #334155;
            --success: #10b981;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 2rem;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        .panel {
            background: var(--card);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }
        h2 { margin-top: 0; font-size: 1.2rem; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        
        label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: #94a3b8; }
        input, select {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 0.5rem;
            transition: 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #475569; cursor: not-allowed; }
        button.secondary { background-color: #475569; }
        button.secondary:hover { background-color: #64748b; }

        .output {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            word-break: break-all;
            white-space: pre-line;
            display: none;
            font-family: monospace;
        }
        .live { background-color: rgba(16, 185, 129, 0.2); border: 1px solid var(--success); color: var(--success); }
        .dead { background-color: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: var(--danger); }
        .info { background-color: rgba(59, 130, 246, 0.2); border: 1px solid var(--primary); color: var(--primary); }

        .row { display: flex; gap: 10px; }
        .col { flex: 1; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- SECTION 1: GENERATOR -->
    <div class="panel">
        <h2>🎲 CC Generator</h2>
        <label>Card Network</label>
        <select id="genNetwork">
            <option value="">Random</option>
            <option value="visa">Visa</option>
            <option value="mastercard">Mastercard</option>
            <option value="amex">Amex</option>
        </select>
        <button onclick="generateCC()">Generate Random Card</button>
        <button class="secondary" onclick="copyToClipboard()">Copy Generated</button>
        <div id="genOutput" class="output"></div>
    </div>

    <!-- SECTION 2: BIN CHECKER -->
    <div class="panel">
        <h2>🔍 BIN Checker</h2>
        <label>Enter first 6 or 8 digits</label>
        <input type="text" id="binInput" placeholder="e.g., 411111" oninput="checkBin()">
        <div id="binOutput" class="output info">Waiting for input...</div>
    </div>

    <!-- SECTION 3: CHECKER -->
    <div class="panel">
        <h2>💳 Live Checker</h2>
        <div id="stripe-container"></div>
        <button id="checkBtn" onclick="checkLive()">Check Balance</button>
        <div id="status" class="output"></div>
    </div>

</div>

<script>
    // 🔑 YOUR PUBLISHABLE KEY
    const stripe = Stripe('pk_test_51U7cR15QRAPh6Gb2aaHJLny4UGoIQjUqmOSTxQAnisN4Ms3FRdkBtSVeKaIuFUN8C2ijNdrPa6YKgFuHfOFjp4xL000rKID5gY');
    const elements = stripe.elements();
    let cardEl = null;

    // 1. INIT STRIPE
    const cardElement = elements.create('card');
    cardElement.mount('#stripe-container');
    cardEl = cardElement;

    // 2. GENERATOR LOGIC
    function generateCC() {
        const network = document.getElementById('genNetwork').value;
        const prefix = network === 'visa' ? '4' : 
                       network === 'mastercard' ? '5' : 
                       network === 'amex' ? '34' : 
                       Math.random() > 0.5 ? '4' : '5';
        
        let length = network === 'amex' ? 15 : 16;
        let num = prefix;
        
        for(let i = prefix.length; i < length - 1; i++) {
            num += Math.floor(Math.random() * 10);
        }
        
        // Luhn Algorithm
        let sum = 0;
        let isEven = false;
        for (let i = num.length - 1; i >= 0; i--) {
            let digit = parseInt(num[i]);
            if (isEven) {
                digit *= 2;
                if (digit > 9) digit -= 9;
            }
            sum += digit;
            isEven = !isEven;
        }
        const checkDigit = (10 - (sum % 10)) % 10;
        const finalCard = num + checkDigit;

        // Format
        let display = finalCard.match(/.{1,4}/g).join(' ');
        if(network === 'amex') display = finalCard.match(/.{1,4}|.{1,6}|.{1,5}/g).join(' ');

        const output = document.getElementById('genOutput');
        output.style.display = 'block';
        output.className = 'info';
        output.innerText = `Number: ${display}\nLuhn: Valid`;
    }

    function copyToClipboard() {
        const text = document.getElementById('genOutput').innerText.split('\n')[0].replace('Number: ', '');
        navigator.clipboard.writeText(text);
        alert('Copied to clipboard!');
    }

    // 3. BIN CHECKER (API)
    async function checkBin() {
        const input = document.getElementById('binInput').value;
        const output = document.getElementById('binOutput');
        
        if (input.length < 6) {
            output.style.display = 'block';
            output.innerText = "Enter at least 6 digits...";
            return;
        }

        output.innerText = "Checking BIN...";
        
        try {
            const response = await fetch(`https://lookup.binlist.net/${input}`);
            const data = await response.json();
            
            if (data.country) {
                output.style.display = 'block';
                output.className = 'info';
                output.innerText = `Bank: ${data.bank?.name || 'Unknown'}\nCountry: ${data.country?.name || 'Unknown'} (${data.country?.alpha2})\nType: ${data.scheme}\nTier: ${data.network?.type || 'N/A'}`;
            } else {
                output.innerText = "BIN not found.";
            }
        } catch (e) {
            output.innerText = "Error fetching BIN data.";
        }
    }

    // 4. CHECKER LOGIC
    async function checkLive() {
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('checkBtn');

        statusDiv.style.display = 'none';
        statusDiv.className = '';
        btn.disabled = true;
        btn.innerText = "Checking...";

        try {
            // Use confirmPayment for $0.00 Auth
            const { error, paymentIntent } = await stripe.confirmPayment({
                elements,
                confirmParams: {
                    return_url: window.location.href,
                },
                redirect: 'if_required',
            });

            if (error) {
                throw error;
            }

            const balance = paymentIntent.amount / 100;
            const currency = paymentIntent.currency.toUpperCase();
            const status = paymentIntent.status;
            const last4 = paymentIntent.last_payment_details.card.last4;
            const brand = paymentIntent.last_payment_details.card.brand;

            statusDiv.style.display = 'block';
            statusDiv.className = 'live';
            statusDiv.innerHTML = `
<strong>✅ ${brand.toUpperCase()} ${last4}</strong><br>
Status: ${status}<br>
Balance: $${balance.toFixed(2)} ${currency}
            `;

        } catch (err) {
            statusDiv.style.display = 'block';
            statusDiv.className = 'dead';
            statusDiv.innerText = `❌ ${err.message}`;
        }

        btn.disabled = false;
        btn.innerText = "Check Balance";
    }
</script>

</body>
</html>
