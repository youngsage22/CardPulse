<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Card Ping</title>
    <!-- Stripe.js Library -->
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.9rem; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 1rem;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input:focus { outline: none; border-color: #3b82f6; }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }
        button:hover { background-color: #2563eb; }
        button:disabled { background-color: #64748b; cursor: not-allowed; }
        
        #status {
            margin-top: 1rem;
            padding: 1rem;
            text-align: center;
            border-radius: 6px;
            display: none;
            font-weight: bold;
        }
        .live { background-color: #10b981; color: white; }
        .dead { background-color: #ef4444; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>Card Ping 🚀</h2>
    
    <label>Card Number</label>
    <input type="text" id="number" placeholder="4242 4242 4242 4242" maxlength="19">

    <label>Expiry (MM/YY)</label>
    <input type="text" id="exp" placeholder="12/25" maxlength="5">

    <label>CVC</label>
    <input type="text" id="cvc" placeholder="123" maxlength="4">

    <button id="pingBtn" onclick="checkCard()">Ping Card</button>
    
    <div id="status"></div>
</div>

<script>
    // ⚠️ REPLACE WITH YOUR STRIPE PUBLISHABLE KEY
    const stripe = Stripe('pk_test_TYooMQauvdEDq54NiTphI7jx'); 

    async function checkCard() {
        const number = document.getElementById('number').value;
        const exp = document.getElementById('exp').value;
        const cvc = document.getElementById('cvc').value;
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('pingBtn');

        if (!number || !exp || !cvc) {
            alert("Please fill in all fields.");
            return;
        }

        // Reset UI
        statusDiv.style.display = 'none';
        statusDiv.className = '';
        btn.disabled = true;
        btn.innerText = "Pinging...";

        try {
            // 1. Create a PaymentMethod
            const { paymentMethod, error } = await stripe.createPaymentMethod({
                type: 'card',
                card: {
                    number,
                    exp_month: parseInt(exp.split('/')[0]),
                    exp_year: parseInt(exp.split('/')[1]),
                    cvc
                }
            });

            if (error) {
                throw error;
            }

            // 2. Create a PaymentIntent to "Authorize" the card
            // We use $0.50 (50 cents) to be safe. This will usually appear as a pending charge.
            const { paymentIntent, error: intentError } = await stripe.createPaymentIntent({
                amount: 50, 
                currency: 'usd',
                payment_method: paymentMethod.id,
                confirm: true,
                // 'manual' means we don't capture the funds immediately, 
                // but it still validates the card.
                capture_method: 'manual' 
            });

            statusDiv.style.display = 'block';
            btn.disabled = false;
            btn.innerText = "Ping Card";

            if (intentError) {
                statusDiv.className = 'dead';
                statusDiv.innerText = `❌ Declined: ${intentError.message}`;
            } else {
                statusDiv.className = 'live';
                statusDiv.innerText = '✅ Approved (Check your bank for pending $0.50)';
            }

        } catch (err) {
            statusDiv.style.display = 'block';
            statusDiv.className = 'dead';
            statusDiv.innerText = '❌ Network Error';
            btn.disabled = false;
            btn.innerText = "Ping Card";
        }
    }
</script>

</body>
</html>
