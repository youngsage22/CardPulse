<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Card Ping</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.9rem; }
        
        /* Stripe Element Styling */
        .stripe-input {
            padding: 12px;
            margin-bottom: 1rem;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }
        button:hover { background-color: #2563eb; }
        button:disabled { background-color: #64748b; cursor: not-allowed; }
        
        #status {
            margin-top: 1rem;
            padding: 1rem;
            text-align: center;
            border-radius: 6px;
            display: none;
            font-weight: bold;
        }
        .live { background-color: #10b981; color: white; }
        .dead { background-color: #ef4444; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>Pro Card Ping 🚀</h2>
    
    <!-- These IDs must match the JS below -->
    <div id="card-element" class="stripe-input"></div>
    
    <button id="pingBtn" onclick="pingCard()">Ping Card</button>
    
    <div id="status"></div>
</div>

    const elements = stripe.elements();
    const cardElement = elements.create('card');
    cardElement.mount('#card-element');

    async function pingCard() {
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('pingBtn');

        // Reset UI
        statusDiv.style.display = 'none';
        statusDiv.className = '';
        btn.disabled = true;
        btn.innerText = "Pinging...";

        try {
            // This creates a token and validates the card instantly
            const { token, error } = await stripe.createToken(cardElement);

            if (error) {
                throw error;
            }

            // If we reach here, the card is valid. 
            // We don't actually charge it, we just "ping" it.
            statusDiv.style.display = 'block';
            statusDiv.className = 'live';
            statusDiv.innerText = `✅ try {
        // 1. Create the token
        const { token, error } = await stripe.createToken(cardElement);
        if (error) throw error;

        // 2. Create a PaymentIntent to actually charge $1.00
        const { paymentIntent, error: chargeError } = await stripe.createPaymentIntent({
            amount: 100, // $1.00
            currency: 'usd',
            payment_method_data: {
                card: {
                    token: token.id,
                },
                capture_method: 'manual',
            },
        });

        statusDiv.style.display = 'block';
        
        if (chargeError) {
            statusDiv.className = 'dead';
            statusDiv.innerText = `❌ Declined: ${chargeError.message}`;
        } else {
            statusDiv.className = 'live';
            statusDiv.innerText = `✅ LIVE (Charged $1.00 - Pending)`;
        }

    } catch (err) {
        statusDiv.style.display = 'block';
        statusDiv.className = 'dead';
        statusDiv.innerText = `❌ Error: ${err.message}`;
    }
    btn.disabled = false;
    btn.innerText = "Ping Card";
} (Token: ${token.id})`;

</html>
