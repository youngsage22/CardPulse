<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardPulse Pro</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #3b82f6; --success: #22c55e; --fail: #ef4444; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding-top: 50px; }
        .container { width: 400px; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; font-weight: 800; letter-spacing: -1px; }
        input, button, textarea, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); }
        button { background: var(--accent); border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        .toggle { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; margin-bottom: 15px; align-items: center; }
        .toggle select { width: auto; padding: 2px 5px; margin: 0; }
        #status { text-align: center; margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 6px; display: none; }
        .live { background: var(--success); color: white; }
        .dead { background: var(--fail); color: white; }
        .hidden { display: none; }
        .api-box { background: #0f172a; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
        label { font-size: 11px; color: #94a3b8; }
        
        /* Bulk Specific Styles */
        textarea { height: 100px; resize: vertical; font-size: 12px; }
        #bulkResults { margin-top: 20px; max-height: 300px; overflow-y: auto; display: none; }
        .result-row { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #334155; font-size: 12px; }
        .status-live { color: var(--success); font-weight: bold; }
        .status-dead { color: var(--fail); font-weight: bold; }
        .status-error { color: #f59e0b; }
    </style>
</head>
<body>

<div class="container">
    <h2>CardPulse Pro</h2>
    
    <!-- API Key Input -->
    <div class="api-box">
        <label>Stripe Secret Key (sk_test_ or sk_live_)</label>
        <input type="password" id="apiKey" placeholder="Paste your SK key here...">
    </div>

    <!-- Mode Toggle -->
    <div class="toggle">
        <span>Mode:</span>
        <select id="mode" style="background: #0f172a; border: none; color: white; padding: 2px;">
            <option value="test">Test (Sandbox)</option>
            <option value="live">Live (Real Money)</option>
        </select>
    </div>

    <!-- Card Details (Single) -->
    <input type="text" id="number" placeholder="Card Number (e.g., 4242...)" maxlength="19">
    <div style="display: flex; gap: 10px;">
        <input type="text" id="exp" placeholder="MM/YY" maxlength="5">
        <input type="text" id="cvc" placeholder="CVC" maxlength="4">
    </div>
    <input type="number" id="amount" placeholder="Amount to Ping (e.g., 100 = $1.00)" value="100">

    <button onclick="checkCard()">PING CARD</button>
    <div id="status"></div>

    <hr style="border-color: #334155; margin: 20px 0;">

    <!-- Bulk Checker Section -->
    <h3 style="font-size: 14px; margin-bottom: 10px;">BULK CHECKER</h3>
    <textarea id="bulkInput" placeholder="4242424242424242|12/25|123|12345|US&#10;4111111111111111|01/24|456|67890|CA"></textarea>
    <button onclick="checkBulk()" style="background: #10b981;">CHECK BULK</button>
    
    <div id="bulkResults"></div>
</div>

<script>
    // --- Helper: Get Card Brand ---
    function getCardBrand(num) {
        if (num.startsWith('4')) return 'Visa';
        if (num.match(/^5[1-5]/)) return 'Mastercard';
        if (num.match(/^3[47]/)) return 'Amex';
        if (num.match(/^6(?:011|5)/)) return 'Discover';
        return 'Unknown';
    }

    // --- Helper: Mask Card Number ---
    function maskCard(num) {
        return num.replace(/(\d{4})\d{10}(\d{4})/, '$1****$2');
    }

    // --- Helper: Add Result to Bulk Table ---
    function addBulkResult(container, cardNum, status, brand, msg) {
        const div = document.createElement('div');
        div.className = 'result-row';
        
        let statusClass = status === 'Live' ? 'status-live' : (status === 'Dead' ? 'status-dead' : 'status-error');
        
        div.innerHTML = `
            <span>${maskCard(cardNum)} (${brand})</span>
            <span class="${statusClass}">${status}</span>
            <span style="color:#94a3b8; max-width: 150px; overflow:hidden; text-overflow:ellipsis;">${msg}</span>
        `;
        container.prepend(div); // Add new results to the top
    }

    // --- Single Card Checker ---
    async function checkCard() {
        const apiKey = document.getElementById('apiKey').value;
        const statusDiv = document.getElementById('status');
        const number = document.getElementById('number').value;
        const exp = document.getElementById('exp').value;
        const cvc = document.getElementById('cvc').value;
        const amount = parseInt(document.getElementById('amount').value) || 100;

        if (!apiKey) {
            statusDiv.style.display = 'block';
            statusDiv.className = 'dead';
            statusDiv.innerHTML = '⚠️ Enter your API Key first.';
            return;
        }

        const stripe = Stripe(apiKey);
        statusDiv.style.display = 'block';
        statusDiv.className = '';
        statusDiv.innerHTML = 'Pinging...';

        try {
            const { paymentMethod, error } = await stripe.createPaymentMethod({
                type: 'card',
                card: {
                    number: number,
                    exp_month: parseInt(exp.split('/')[0]),
                    exp_year: parseInt(exp.split('/')[1]),
                    cvc: cvc,
                },
            });

            if (error) {
                statusDiv.className = 'dead';
                statusDiv.innerHTML = `❌ ${error.message}`;
                return;
            }

            // Create Payment Intent to "Ping"
            const response = await fetch('https://api.stripe.com/v1/payment_intents', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: new URLSearchParams({
                    amount: amount,
                    currency: 'usd',
                    payment_method: paymentMethod.id,
                    confirm: 'true',
                    capture_method: 'manual' // Don't charge immediately
                })
            });

            const data = await response.json();

            if (data.error) {
                statusDiv.className = 'dead';
                statusDiv.innerHTML = `❌ ${data.error.message}`;
            } else if (data.status === 'requires_payment_method') {
                statusDiv.className = 'dead';
                statusDiv.innerHTML = `❌ Declined (${getCardBrand(number)})`;
            } else {
                statusDiv.className = 'live';
                statusDiv.innerHTML = `✅ Live (${getCardBrand(number)})`;
            }

        } catch (err) {
            statusDiv.className = 'dead';
            statusDiv.innerHTML = `❌ Error: ${err.message}`;
        }
    }

    // --- Bulk Checker Logic ---
    async function checkBulk() {
        const apiKey = document.getElementById('apiKey').value;
        const bulkInput = document.getElementById('bulkInput').value;
        const resultsContainer = document.getElementById('bulkResults');
        const amount = parseInt(document.getElementById('amount').value) || 100;

        if (!apiKey) {
            alert("Please enter your API Key first!");
            return;
        }

        resultsContainer.style.display = 'block';
        resultsContainer.innerHTML = ''; // Clear previous

        const lines = bulkInput.split('\n').filter(line => line.trim() !== '');
        
        // Process concurrently to avoid rate limits (max 5 at a time)
        const concurrency = 5;
        let index = 0;

        const processNext = async () => {
            if (index >= lines.length) return;
            const line = lines[index++].trim();
            const parts = line.split('|');
            
            if (parts.length < 3) return; // Skip bad lines

            const [num, exp, cvc, zip = '', country = 'US'] = parts.map(p => p.trim());

            try {
                const stripe = Stripe(apiKey);
                const { paymentMethod, error } = await stripe.createPaymentMethod({
                    type: 'card',
                    card: {
                        number: num,
                        exp_month: parseInt(exp.split('/')[0]),
                        exp_year: parseInt(exp.split('/')[1]),
                        cvc: cvc,
                    },
                    billing_details: {
                        address: {
                            postal_code: zip,
                            country: country
                        }
                    }
                });

                if (error) {
                    addBulkResult(resultsContainer, num, 'Dead', getCardBrand(num), error.message);
                    return;
                }

                const response = await fetch('https://api.stripe.com/v1/payment_intents', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: new URLSearchParams({
                        amount: amount,
                        currency: 'usd',
                        payment_method: paymentMethod.id,
                        confirm: 'true',
                        capture_method: 'manual'
                    })
                });

                const data = await response.json();

                if (data.error || data.status === 'requires_payment_method') {
                    addBulkResult(resultsContainer, num, 'Dead', getCardBrand(num), data.error?.message || 'Declined');
                } else {
                    addBulkResult(resultsContainer, num, 'Live', getCardBrand(num), 'Approved');
                }

            } catch (err) {
                addBulkResult(resultsContainer, num, 'Error', getCardBrand(num), err.message);
            }

            // Trigger next
            if (index < lines.length) {
                processNext();
            }
        };

        // Kick off batches
        for (let i = 0; i < concurrency && i < lines.length; i++) {
            processNext();
        }
    }
</script>

</body>
</html>
